# /etc/systemd/system/rmtfs.service.d/lumia1520.conf
# docs/msm8974-modem-mapping.md section 26-27.
#
# The Lumia 1520 (Windows Phone GPT) names the modem EFS partitions
# MODEM_FS1/FS2/FSC/FSG; rmtfs -P looks for modemst1/modemst2/fsc/fsg.
# Serve them through a directory of links, READ-ONLY (-r: the modem's writes
# stay in an in-memory shadow) until the EFS write decision is made.
# -s: rmtfs starts the MSS remoteproc once its service is published and stops
# it when rmtfs exits.
[Unit]
Requires=dev-disk-by\x2dpartlabel-MODEM_FS1.device dev-disk-by\x2dpartlabel-MODEM_FS2.device dev-disk-by\x2dpartlabel-MODEM_FSC.device dev-disk-by\x2dpartlabel-MODEM_FSG.device
After=dev-disk-by\x2dpartlabel-MODEM_FS1.device dev-disk-by\x2dpartlabel-MODEM_FS2.device dev-disk-by\x2dpartlabel-MODEM_FSC.device dev-disk-by\x2dpartlabel-MODEM_FSG.device

[Service]
ExecStartPre=/bin/mkdir -p /run/rmtfs-parts
ExecStartPre=/bin/ln -sfn /dev/disk/by-partlabel/MODEM_FS1 /run/rmtfs-parts/modemst1
ExecStartPre=/bin/ln -sfn /dev/disk/by-partlabel/MODEM_FS2 /run/rmtfs-parts/modemst2
ExecStartPre=/bin/ln -sfn /dev/disk/by-partlabel/MODEM_FSC /run/rmtfs-parts/fsc
ExecStartPre=/bin/ln -sfn /dev/disk/by-partlabel/MODEM_FSG /run/rmtfs-parts/fsg
ExecStart=
ExecStart=/usr/bin/rmtfs -r -P -s -o /run/rmtfs-parts
